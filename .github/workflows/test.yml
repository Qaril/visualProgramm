name: Typescript CI

on:
  push:
    branches: [ lab3 ]
  pull_request:
    branches: [ lab3 ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: ./lab3

      - name: Run tests
        run: npm test
        working-directory: ./lab3