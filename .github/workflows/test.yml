name: Typescript CI

on:
  push:
    branches: [ lab6 ]
  pull_request:
    branches: [ lab6 ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies

        run: npm ci

      - name: Run tests

        run: npm test